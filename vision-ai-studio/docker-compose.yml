# Ambiente completo: PostgreSQL + MinIO (S3) + migração + web + worker.
# Uso: cp .env.example .env  &&  docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vision
      MINIO_ROOT_PASSWORD: vision-secret-key
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 vision vision-secret-key; do sleep 1; done;
      mc mb --ignore-existing local/vision; mc anonymous set none local/vision; exit 0"

  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    command: ["node_modules/.bin/tsx", "packages/db/src/migrate.ts"]
    environment: &common
      DATABASE_URL: postgres://vision:vision@postgres:5432/vision
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: vision
      S3_ACCESS_KEY_ID: vision
      S3_SECRET_ACCESS_KEY: vision-secret-key
      S3_FORCE_PATH_STYLE: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:-20}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    environment: *common
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      <<: *common
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 1

volumes:
  pgdata:
  miniodata:
