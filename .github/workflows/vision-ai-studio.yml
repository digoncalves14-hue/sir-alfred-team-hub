name: VISION AI STUDIO

on:
  push:
    paths: ["vision-ai-studio/**", ".github/workflows/vision-ai-studio.yml"]
  pull_request:
    paths: ["vision-ai-studio/**", ".github/workflows/vision-ai-studio.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-ai-studio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vision
          POSTGRES_PASSWORD: vision
          POSTGRES_DB: vision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vision" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://vision:vision@localhost:5432/vision_test
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vision-ai-studio/package-lock.json
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes com FFmpeg real
        run: npm run test:media
      - name: Testes de integração (fila no PostgreSQL)
        run: npm run test:integration
      - name: Build da aplicação web
        run: npm run build
