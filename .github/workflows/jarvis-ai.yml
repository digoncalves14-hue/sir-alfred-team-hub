name: JARVIS AI

on:
  push:
    paths: ["jarvis-ai/**", ".github/workflows/jarvis-ai.yml"]
  pull_request:
    paths: ["jarvis-ai/**", ".github/workflows/jarvis-ai.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-ai
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JARVIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-ai/package-lock.json
      - run: npm ci
      - name: Verificação de tipos (shared, server, mobile)
        run: npm run typecheck
      - name: Testes unitários e de API
        run: npm test
      - name: Testes de integração (migração + RLS no PostgreSQL)
        run: npm run test:integration
      - name: Bundle iOS (Metro/Hermes)
        working-directory: jarvis-ai/apps/mobile
        run: npx expo export --platform ios --output-dir dist-verify
